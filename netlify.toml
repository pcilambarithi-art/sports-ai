[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API requests to your non-AWS backend (replace YOUR_BACKEND_URL with Railway / VPS / Tunnel URL)
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR_BACKEND_URL/api/:splat"
#   status = 200
#   force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
